# One fixed open-weight model for every role (agent, planner, executor, curator, meta-reasoner).
model: openai/gpt-oss-20b        # same model as Harness Design I; gpt-oss-120b is the stronger option
base_url: https://openrouter.ai/api/v1
temperature: 1.0                 # recommended for gpt-oss; seeds give run-to-run variation
max_tokens: 4096                 # per model call, reasoning included
reasoning_effort: low            # thinking models: low | medium | high; null for non-thinking models
provider:                        # OpenRouter provider routing (keep fixed for reproducibility)
  order: [Groq]                  # one provider: switching providers mid-run breaks prefix caching
  require_parameters: true       # only providers that support tools + seed
  allow_fallbacks: true          # fall back only if Groq is unavailable (logged per call)
max_retries: 3

